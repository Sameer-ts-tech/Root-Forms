services:
  - type: web
    name: trpc-backend
    env: node
    buildCommand: "pnpm install && pnpm turbo run build --filter=api"
    startCommand: "pnpm --filter @repo/database db:migrate:prod && pnpm --filter=api start"
    envVars:
      - key: NODE_VERSION
        value: 18.20.2
      - key: PNPM_VERSION
        value: 9.0.0
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: WEB_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
